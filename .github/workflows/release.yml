# Builds a signed release APK and the server, and publishes them on GitHub.
#
# - Every push to main (each merged pull request) becomes a release tagged
#   <appVersion from gradle.properties>.<run number>, e.g. 0.1.57, with the APKs attached: the
#   phone app and the Wear OS watch app (installed on the watch with adb), and the server archive
#   for LXC installs; the server's Docker image goes to ghcr.io/<owner>/booksound-server.
# - A release published by hand (Releases → Draft a new release) gets the APK attached.
# - Run by hand from the Actions tab: the APK is kept as a workflow artifact.
#
# All three share this workflow's run number, which is also the APK's versionCode, so every new
# build installs over the previous one.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     the release keystore, base64-encoded
#   KEYSTORE_PASSWORD   its password
#   KEY_ALIAS           the key's alias
#   KEY_PASSWORD        the key's password
#   GOOGLE_BOOKS_API_KEY  optional, for Google Books cover search
# Always sign with the same keystore: Android only installs an update signed with the same key.
name: Release APK

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties asks for JDK 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # The action's default package list still names "tools", which the SDK no longer has.
      # platform-tools is enough: the Android Gradle plugin downloads the SDK platform itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing; an unsigned APK can't be installed. See the top of this file."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "BOOKSOUND_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Work out the version
        run: |
          BASE="$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '[:space:]')"
          case "${{ github.event_name }}" in
            release) NAME="${{ github.event.release.tag_name }}"; NAME="${NAME#v}" ;;
            *) NAME="${BASE:-0.1}.${{ github.run_number }}" ;;
          esac
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          BOOKSOUND_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BOOKSOUND_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BOOKSOUND_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        # - A bigger heap: R8, the slowest step, runs inside the Gradle daemon, and 2 GB is tight
        #   for it (the runner has 16 GB).
        # - No lintVitalRelease: it ran next to R8 on the runner's 4 cores and slowed it down.
        run: |
          chmod +x gradlew
          ./gradlew :core:test :api:test :server:test :app:assembleRelease :wear:assembleRelease :server:installDist :server:distTar \
            -x lintVitalRelease \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -PversionName="$VERSION_NAME" \
            -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "BookSound-$VERSION_NAME.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "BookSound-Watch-$VERSION_NAME.apk"
          cp server/build/distributions/booksound-server.tar.gz "BookSound-Server-$VERSION_NAME.tar.gz"

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "BookSound-$VERSION_NAME.apk" "BookSound-Watch-$VERSION_NAME.apk" "BookSound-Server-$VERSION_NAME.tar.gz" --clobber

      - name: Publish a release for the push to main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION_NAME" "BookSound-$VERSION_NAME.apk" "BookSound-Watch-$VERSION_NAME.apk" "BookSound-Server-$VERSION_NAME.tar.gz" \
            --target "${{ github.sha }}" \
            --title "BookSound $VERSION_NAME" \
            --generate-notes

      # The server image, for amd64 and arm64 (the jars are the same; arm64 runs without torrents).
      # The arm64 image runs its RUN steps under emulation on the amd64 runner.
      - name: Set up QEMU
        if: github.event_name != 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: github.event_name != 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the server image
        if: github.event_name != 'workflow_dispatch'
        run: |
          IMAGE="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/booksound-server"
          docker buildx build --platform linux/amd64,linux/arm64 -f deploy/Dockerfile \
            -t "$IMAGE:$VERSION_NAME" -t "$IMAGE:latest" --push .

      - name: Smoke-test the server image
        if: github.event_name != 'workflow_dispatch'
        run: |
          IMAGE="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/booksound-server"
          docker run -d --name booksound -p 8080:8080 "$IMAGE:$VERSION_NAME"
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/status && exit 0; sleep 2; done
          docker logs booksound
          exit 1

      - name: Keep the APK as an artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: BookSound-${{ env.VERSION_NAME }}
          path: |
            BookSound-*.apk
            BookSound-Server-*.tar.gz
