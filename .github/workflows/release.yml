# Builds a signed release APK and attaches it to the GitHub release.
#
# Runs when a release is published (Releases → Draft a new release → tag e.g. v1.2 → Publish),
# or by hand from the Actions tab (the APK is then kept as a workflow artifact).
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     the release keystore, base64-encoded
#   KEYSTORE_PASSWORD   its password
#   KEY_ALIAS           the key's alias
#   KEY_PASSWORD        the key's password
#   GOOGLE_BOOKS_API_KEY  optional, for Google Books cover search
# Always sign with the same keystore: Android only installs an update signed with the same key.
name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties asks for JDK 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing; an unsigned APK can't be installed. See the top of this file."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "BOOKSOUND_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Work out the version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            NAME="${{ github.event.release.tag_name }}"
          else
            NAME="$(git describe --tags --always)"
          fi
          echo "VERSION_NAME=${NAME#v}" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          BOOKSOUND_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BOOKSOUND_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BOOKSOUND_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "BookSound-$VERSION_NAME.apk"

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "BookSound-$VERSION_NAME.apk" --clobber

      - name: Keep the APK as an artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: BookSound-${{ env.VERSION_NAME }}
          path: BookSound-*.apk
