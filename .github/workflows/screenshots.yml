# Takes the README's phone screenshots on an emulator and commits them to the branch they were taken on.
#
# Runs when the screenshot tools change, or by hand from the Actions tab. The demo library (public-domain books,
# covers drawn by tools/screenshots/covers.py) is built fresh each time; tools/screenshots/phone.py walks the app.
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "tools/screenshots/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Tools for the demo library
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet pillow
          mkdir -p "$RUNNER_TEMP/fonts" && cd "$RUNNER_TEMP/fonts"
          for p in playfair-display cinzel abril-fatface bebas-neue cormorant-garamond; do
            npm pack --silent "@fontsource/$p@5.3.0" > /dev/null && tar xzf fontsource-$p-*.tgz && mv package "$p"
          done

      - name: Build the app and the demo library
        run: |
          python3 tools/screenshots/covers.py "$RUNNER_TEMP/fonts" "$RUNNER_TEMP/covers"
          chmod +x gradlew
          ./gradlew :app:assembleDebug :core:demoLibrary -PdemoOut="$RUNNER_TEMP/demo" -PdemoCovers="$RUNNER_TEMP/covers" \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/screenshots/phone.py app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/demo" screenshots tools/screenshots/debug

      - name: Commit the screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots tools/screenshots/debug 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screenshots from the emulator (${{ job.status }})"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
