# docker compose -f deploy/docker-compose.yml up -d
# The setup token for the first (admin) account is printed in the log: docker compose logs booksound
services:
  booksound:
    image: ghcr.io/hutao1love/booksound-server:latest
    container_name: booksound
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      # Everything the server keeps: the library (Author/Series/NN - Title.m4b), its database, covers,
      # watch copies and downloads. An existing library folder can be mounted as /data/library.
      - ./booksound-data:/data
    environment:
      # The reverse proxy's address, so the server sees the real client address and https.
      BOOKSOUND_TRUSTED_PROXIES: "192.168.1.1"
      TZ: "Europe/Moscow"
      # "Install update" on the admin page, through the watchtower service below (uncomment both). Without it the
      # page shows the command to run instead: docker compose pull && docker compose up -d
      # BOOKSOUND_UPDATER: "watchtower"
      # BOOKSOUND_WATCHTOWER_URL: "http://watchtower:8080"
      # BOOKSOUND_WATCHTOWER_TOKEN: "change-me-to-a-long-random-string"
    labels:
      # Watchtower updates only the containers with this label.
      com.centurylinklabs.watchtower.enable: "true"

  # Pulls the new image and restarts the server when the admin page asks for it (and only then).
  # watchtower:
  #   image: nickfedor/watchtower:latest
  #   container_name: watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     WATCHTOWER_HTTP_API_ENDPOINTS: "update"
  #     WATCHTOWER_HTTP_API_TOKEN: "change-me-to-a-long-random-string"
  #     WATCHTOWER_LABEL_ENABLE: "true"
  #     WATCHTOWER_CLEANUP: "true"
